<!-- menu.html - Versión optimizada para GitHub Pages -->
<nav class="main-menu" role="navigation" aria-label="Menú principal">
  <ul>
    <li><a href="https://www.alarsi.com/creatividad.html">Creatividad</a></li>

    <li class="logo-item">
      <a href="https://www.alarsi.com" aria-label="Inicio ALARSI">
        <img 
          src="https://www.alarsi.com/images/alarsi-logo.svg"
          alt="ALARSI — Creatividad, Tecnología e IA"
          class="menu-logo"
          width="180"
          height="60"
          decoding="async"
          fetchpriority="high"
        />
      </a>
    </li>

    <li><a href="https://www.alarsi.com/integracion.html">Integración</a></li>
    <li><a href="https://www.alarsi.com/desarrollo.html">Desarrollo</a></li>
  </ul>
</nav>

<style>
  .main-menu {
    display: flex;
    justify-content: center;
    position: absolute;
    top: 20px;
    left: 0;
    right: 0;
    margin: 0 auto;
    width: fit-content;
    min-width: 280px;
    max-width: 95%;
    padding: 10px 30px;
    background-color: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(12px);
    border-radius: 999px;
    z-index: 1000;
  }

  .main-menu ul {
    display: flex;
    list-style: none;
    margin: 0;
    padding: 0;
    gap: 22px;
    align-items: center;
  }

  .main-menu a {
    color: white;
    text-decoration: none;
    font-size: 12px;
    padding: 8px 30px;
    border-radius: 999px;
    transition: all 0.3s ease;
    white-space: nowrap;
  }

  .main-menu a.active {
    background: white;
    color: black;
  }

  .main-menu a:hover:not(.active) {
    background: rgba(255, 255, 255, 0.1);
  }

  .menu-logo {
    height: 20px;
    width: auto;
    filter: brightness(0) invert(1);
  }

  /* ==================== RESPONSIVE ==================== */
  @media screen and (max-width: 768px) {
    .main-menu {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      padding: calc(6px + env(safe-area-inset-top, 0px)) 8px 6px;
      border-radius: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .main-menu ul {
      gap: 4px;
    }

    .main-menu a {
      font-size: 9px;
      padding: 4px 12px;
      letter-spacing: -0.02em;
    }

    .menu-logo {
      height: 18px;
    }

    body {
      padding-top: calc(52px + env(safe-area-inset-top, 0px));
    }
  }
</style>

<script>
  // Marcar enlace activo
  document.addEventListener("DOMContentLoaded", () => {
    const currentPath = window.location.pathname.replace(/\/$/, '') || '/';
    
    document.querySelectorAll('.main-menu a').forEach(link => {
      const linkPath = new URL(link.href, window.location.origin).pathname.replace(/\/$/, '') || '/';
      link.classList.toggle('active', linkPath === currentPath);
    });
  });
</script>
